        .hero-center-logo svg {
            width: 200px; height: 200px;
            animation: logoGlow 3s ease-in-out infinite;
        }

        /* ========== SECTION COMMON ========== */
        .section { padding: 120px 50px; position: relative; overflow: hidden; }
        .section-header { text-align: center; max-width: 700px; margin: 0 auto 80px; }
        .section-label {
            display: inline-flex; align-items: center; gap: 12px;
            color: var(--orange); font-weight: 700;
            font-size: 12px; letter-spacing: 4px;
            text-transform: uppercase; margin-bottom: 20px;
        }
        .section-label::before, .section-label::after {
            content: ''; width: 40px; height: 1px; background: var(--orange);
        }
        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(26px, 3.5vw, 44px);
            font-weight: 800; margin-bottom: 20px; line-height: 1.2;
            color: var(--white);
        }
        .section-title span { color: var(--orange); }
        .section-desc { color: var(--gray); font-size: 16px; line-height: 1.8; }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 1200px) {
            .brand-cards-grid { grid-template-columns: repeat(2, 1fr); }
            .specs-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 1024px) {
            .hero-container { grid-template-columns: 1fr; text-align: center; }
            .hero-content { order: 2; } .hero-visual { order: 1; }
            .hero-desc { margin: 0 auto 36px; }
            .hero-buttons { justify-content: center; }
            .hero-stats { justify-content: center; }
            .engine-steps { grid-template-columns: 1fr; }
            .hero-logo-showcase { width: 320px; height: 320px; }
            .parts-grid { grid-template-columns: repeat(2, 1fr); }
            .footer-grid { grid-template-columns: 1fr 1fr; }
            .contact-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 768px) {
            .section { padding: 80px 20px; }
            .navbar { padding: 0 16px; }
            .nav-links { display: none; }
            .mobile-toggle { display: block; }
            .hero-container { padding: 100px 20px 60px; gap: 40px; }
            .parts-grid { grid-template-columns: 1fr; }
            .brand-cards-grid { grid-template-columns: 1fr; }
            .specs-grid { grid-template-columns: 1fr; }
            .footer-grid { grid-template-columns: 1fr; gap: 36px; }
            .footer-bottom { flex-direction: column; text-align: center; }
            .hero-logo-showcase { width: 250px; height: 250px; }
            .cursor-follower, .cursor-dot { display: none; }
            .tachometer { width: 220px; height: 220px; }
            .tach-needle { height: 80px; }
            .cta-btns { flex-direction: column; align-items: center; }
            .float-btn-top { bottom: 20px; right: 16px; width: 44px; height: 44px; font-size: 16px; }
        }

        /* ========== MOBILE MENU ========== */
        .mobile-menu {
            position: fixed; top: 0; right: -100%; width: 300px; height: 100vh;
            background: var(--black-card); z-index: 1001;
            padding: 100px 30px 30px; transition: right 0.4s ease;
            border-left: 1px solid var(--black-border);
            box-shadow: -10px 0 30px rgba(0,0,0,0.1);
        }
        .mobile-menu.open { right: 0; }
        .mobile-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            z-index: 1000; opacity: 0; visibility: hidden; transition: var(--transition);
        }
        .mobile-overlay.open { opacity: 1; visibility: visible; }
        .mobile-menu-close {
            position: absolute; top: 24px; right: 24px;
            background: none; border: none; color: var(--white);
            font-size: 24px; cursor: pointer;
        }
        .mobile-menu ul { list-style: none; }
        .mobile-menu li { margin-bottom: 16px; }
        .mobile-menu a {
            color: var(--white); font-size: 16px; font-weight: 600;
            display: block; padding: 12px 0;
            border-bottom: 1px solid var(--black-border);
            transition: var(--transition);
        }
        .mobile-menu a:hover { color: var(--orange); padding-left: 10px; }

        /* MINIMAL STYLES FOR SEO - Keep essentials only */
        h1, h2, h3, h4, h5, h6 { margin: 0; padding: 0; }
        p { margin: 0; padding: 0; }
